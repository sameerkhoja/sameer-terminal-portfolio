<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0d12" />
    <title>Sameer Khoja Resume</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0b0d12;
        color: #e6e8ee;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-width: 320px;
        min-height: 100vh;
        background: #0b0d12;
      }

      main {
        width: min(1040px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 34px 0;
      }

      header {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 24px;
        margin-bottom: 18px;
      }

      h1 {
        margin: 0;
        color: #f3f4f7;
        font-size: clamp(28px, 5vw, 44px);
        line-height: 1;
        letter-spacing: -0.04em;
      }

      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        justify-content: flex-end;
      }

      a {
        color: #9aaeff;
        font-size: 14px;
        font-weight: 700;
        text-decoration: none;
      }

      a:hover,
      a:focus-visible {
        color: #e6e8ee;
        outline: none;
      }

      iframe {
        width: 100%;
        min-height: 78vh;
        border: 1px solid #3a4251;
        background: #171b24;
      }

      p {
        margin: 14px 0 0;
        color: #9ba3b1;
        font-size: 14px;
        line-height: 1.6;
      }

      @media (max-width: 700px) {
        header {
          display: block;
        }

        nav {
          justify-content: flex-start;
          margin-top: 14px;
        }

        iframe {
          min-height: 70vh;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Sameer Khoja Resume</h1>
        <nav aria-label="Resume downloads">
          <a href="Sameer_Khoja_Resume.pdf" download>Download PDF</a>
          <a href="Sameer_Khoja_Resume.tex" download>Download LaTeX</a>
          <a href="/">Home</a>
        </nav>
      </header>

      <iframe src="Sameer_Khoja_Resume.pdf" title="Sameer Khoja Resume PDF"></iframe>
      <p>If the preview does not load, <a href="Sameer_Khoja_Resume.pdf" download>download the PDF</a>.</p>
    </main>
  </body>
</html>
